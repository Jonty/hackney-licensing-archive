name: Update data
concurrency: scrape
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  update-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          persist-credentials: false
      - name: Update and commit
        run: |
          pip install -r requirements.txt

          python -u scrape_licensing_applications.py
          git add licensing_applications.csv

          git config --global user.email "bot@jonty.co.uk"
          git config --global user.name "Licensing Archive Update GHA"

          # || true means this won't error when there's nothing to commit
          git commit -m "Automatic licensing data update" || true
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
